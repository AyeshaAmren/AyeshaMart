<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Ayesha Mart logo">
  <defs>
    <linearGradient id="amGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F1D80"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="amAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2A61C"/>
      <stop offset="1" stop-color="#FFC24D"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#amGrad)"/>

  <!-- Shopping bag body -->
  <path d="M21 27h22l-2 24a3.5 3.5 0 0 1-3.5 3H26.5A3.5 3.5 0 0 1 23 51l-2-24z" fill="#FFFFFF" opacity="0.95"/>
  <!-- Bag handle -->
  <path d="M25 26c0-6 3-10 7-10s7 4 7 10" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

  <!-- Amber price tag dot on the bag -->
  <circle cx="32" cy="42" r="4.5" fill="url(#amAccent)"/>
  <circle cx="32" cy="42" r="1.7" fill="#3D1D5C"/>
</svg>